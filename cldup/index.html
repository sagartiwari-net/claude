<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolsMandi — Central Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f8fafc;
            --bg-card: #ffffff;
            --border-color: rgba(226, 232, 240, 0.8);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: rgba(79, 70, 229, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --success-light: rgba(16, 185, 129, 0.08);
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.08);
            --shadow: 0 4px 20px -2px rgba(148, 163, 184, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Layout Structure */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            z-index: 10;
        }
        .logo-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            font-size: 24px;
            background: linear-gradient(135deg, var(--primary) 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .logo-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: capitalize;
        }
        .logout-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .logout-btn:hover {
            color: var(--danger);
        }

        /* Container & Navigation */
        .wrapper {
            display: flex;
            flex: 1;
            height: calc(100vh - 73px);
            max-height: calc(100vh - 73px);
            overflow: hidden;
            position: relative;
        }
        .sidebar {
            width: 250px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-item:hover, .nav-item.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }

        /* Bottom Nav Mobile */
        .bottom-nav {
            display: none;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 10px 0;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            justify-content: space-around;
            z-index: 100;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.02);
        }
        .bnav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }
        .bnav-item.active {
            color: var(--primary);
            font-weight: 700;
        }
        .bnav-icon {
            font-size: 20px;
        }

        /* Main View */
        main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            min-height: 0;
            height: 100%;
            max-height: 100%;
            padding-bottom: 80px; /* Mobile safety */
        }
        .page {
            display: none;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Headers & Metrics */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .page-title h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .page-title p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 2px;
        }

        /* Metric Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow);
        }
        .metric-label {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }
        .metric-value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--text-main) 0%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Cards & Lists */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
        }

        /* Forms & Inputs */
        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-danger-outline {
            background: var(--danger-light);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-danger-outline:hover {
            background: var(--danger);
            color: #ffffff;
        }
        
        /* Modal Overlay (Drawers) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg-card);
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            animation: modalSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalSlide {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .automation-preview-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 12px;
            color: #334155;
            line-height: 1.5;
        }
        .automation-preview-box code {
            display: block;
            margin-top: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 11px;
            word-break: break-all;
            color: #1e293b;
            background: #eef2ff;
            padding: 8px 10px;
            border-radius: 8px;
        }
        .automation-preview-title {
            font-weight: 700;
            font-size: 12px;
            color: #475569;
            margin-bottom: 4px;
        }
        #modal-automation .modal-content {
            max-width: 620px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            background: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Checkbox lists for reseller mappings */
        .checkbox-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            background: #f8fafc;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 13px;
            font-weight: 500;
        }

        /* Tables & Responsive Grid lists */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }
        td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-success { background: var(--success-light); color: var(--success); }
        .badge-danger { background: var(--danger-light); color: var(--danger); }
        .badge-warning { background: rgba(245, 158, 11, 0.08); color: var(--warning); }

        /* Login Layout */
        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(79, 70, 229, 0.05);
            text-align: center;
        }
        .login-card h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .login-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .bottom-nav { display: flex; }
            main { padding: 16px; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .btn-primary { width: 100%; justify-content: center; }
            header { padding: 12px 16px; }
            .logo-title { font-size: 16px; }
            .user-badge { display: none; }
            
            /* Card Grid conversions for mobile */
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr { border: 1px solid var(--border-color); border-radius: 16px; margin-bottom: 12px; padding: 10px; background: var(--bg-card); }
            td { border: none; border-bottom: 1px solid rgba(226, 232, 240, 0.4); position: relative; padding-left: 50%; text-align: right; }
            td:last-child { border-bottom: none; }
            td:before {
                position: absolute;
                top: 14px;
                left: 16px;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                content: attr(data-label);
                text-align: left;
                font-weight: 600;
                color: var(--text-muted);
                font-size: 12px;
            }
        }

        /* ── SECONDARY BUTTON ── */
        .btn-secondary {
            background: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
        .text-muted { color: var(--text-muted); }

        /* ── CARD GRID VIEW FOR ACCOUNTS ── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .account-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: all 0.25s;
        }
        .account-card:hover {
            border-color: rgba(79, 70, 229, 0.3);
            box-shadow: 0 8px 32px -4px rgba(79, 70, 229, 0.12);
            transform: translateY(-2px);
        }
        .account-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
        .account-card-name { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .account-card-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
        .account-card-body { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .account-card-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .account-card-label { color: var(--text-muted); font-weight: 500; }
        .account-card-value {
            font-weight: 600; color: var(--text-main); font-size: 12px;
            max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right;
        }
        .account-card-actions { display: flex; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 14px; }
        .account-card-actions button { flex: 1; }

        /* ── TAB SWITCHER ── */
        .tab-switcher {
            display: flex;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            gap: 2px;
        }
        .tab-btn {
            background: transparent; border: none;
            padding: 7px 18px; border-radius: 9px;
            font-family: inherit; font-size: 13px; font-weight: 600;
            color: var(--text-muted); cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--bg-card); color: var(--primary);
            box-shadow: 0 1px 6px rgba(0,0,0,0.07);
        }
        .tab-btn:hover:not(.active) { color: var(--text-main); }

        /* ── FILTER BAR ── */
        .filter-bar {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
            margin-bottom: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 18px;
            box-shadow: var(--shadow);
        }
        .filter-bar .form-control { margin-bottom: 0; background: var(--bg-base); }
    </style>
</head>
<body>
    <div id="root">
        <!-- SPA loads dynamically here -->
    </div>

    <script>
        // ── CORE STATE MANAGEMENT ────────────────────────────────────────────────
        const State = {
            authToken: localStorage.getItem('admin_token') || '',
            user: JSON.parse(localStorage.getItem('admin_user') || 'null'),
            activeTab: 'dashboard',
            stats: { active_sessions: 0, accounts_total: 0, credit_hits_today: 0 },
            accounts: [],
            users: [],
            sessions: [],
            websites: [],
            resellers: [],
            violations: [],
            products: [],
            tools: [],
            proxies: [],
            automationDefaults: {
                panel_base_url: window.location.origin,
                default_automation_api_url: 'https://dashboard.seotoolscart.com/api/tasks/run',
                global_ingest_token: '',
                ingest_auth_header: 'Authorization: Bearer <token>',
                ingest_env_hint: 'TOOLSMANDI_INGEST_TOKEN=<token>'
            },
            currentAutomationAccount: null
        };

        function getIngestTokenForAccount(account) {
            if (!account) return State.automationDefaults?.global_ingest_token || '';
            return (account.website_secret_key || '').trim() || State.automationDefaults?.global_ingest_token || '';
        }

        async function loadAutomationDefaults() {
            const data = await apiFetch('/api/admin/automation/defaults');
            if (data) {
                State.automationDefaults = data;
            }
        }

        function getPanelBaseUrl() {
            return (State.automationDefaults?.panel_base_url || window.location.origin).replace(/\/$/, '');
        }

        function updateAutomationPreviews() {
            const apiUrl = (document.getElementById('auto-api-url')?.value || '').trim()
                || State.automationDefaults?.default_automation_api_url
                || 'https://dashboard.seotoolscart.com/api/tasks/run';
            const taskUID = (document.getElementById('auto-goauto-task')?.value || '').trim();
            const ingestKey = (document.getElementById('auto-ingest-key')?.value || '').trim();
            const panelBase = getPanelBaseUrl();
            const ingestToken = getIngestTokenForAccount(State.currentAutomationAccount);

            const tokenPreview = document.getElementById('auto-token-preview');
            if (tokenPreview) {
                tokenPreview.innerHTML = ingestToken ? `
                    <div class="automation-preview-title">GoAuto Ingest Token (is website / tool ke liye)</div>
                    <div>GoAuto server par ye env set karein:</div>
                    <code>TOOLSMANDI_INGEST_TOKEN=${ingestToken}</code>
                    <div style="margin-top:8px;font-size:11px;color:#64748b;">Ya header me: Authorization: Bearer ${ingestToken}</div>
                ` : `
                    <div class="automation-preview-title">GoAuto Ingest Token</div>
                    <div style="color:#64748b;">Website ka handshake secret_key load nahi hua. Global token: ${State.automationDefaults?.global_ingest_token || 'config.json secret_key'}</div>
                `;
            }

            const triggerPreview = document.getElementById('auto-trigger-preview');
            if (triggerPreview) {
                if (apiUrl && taskUID) {
                    triggerPreview.innerHTML = `
                        <div class="automation-preview-title">GoAuto Trigger — Full Request</div>
                        <div>Logout par ye API call hogi:</div>
                        <code>POST ${apiUrl}\nHeaders: Authorization: Bearer &lt;goauto_token&gt;\nBody: {"task_uid":"${taskUID}"}</code>
                    `;
                } else {
                    triggerPreview.innerHTML = `
                        <div class="automation-preview-title">GoAuto Trigger — Full Request</div>
                        <div style="color:#64748b;">Trigger API URL aur Task UID dono bharte hi poora request yahan dikhega.</div>
                    `;
                }
            }

            const ingestPreview = document.getElementById('auto-ingest-preview');
            if (ingestPreview) {
                if (ingestKey) {
                    ingestPreview.innerHTML = `
                        <div class="automation-preview-title">Cookie Ingest — Full API URL</div>
                        <div>Automation is ingest key se account dhundh kar cookie update karega:</div>
                        <code>POST ${panelBase}/api/automation/ingest/${ingestKey}\nHeaders: Authorization: Bearer ${ingestToken || '<token>'}\nBody: {"cookie":"...","user_agent":"..."}</code>
                    `;
                } else {
                    ingestPreview.innerHTML = `
                        <div class="automation-preview-title">Cookie Ingest — Full API URL</div>
                        <div style="color:#64748b;">Ingest Key bharte hi poora API URL yahan dikhega.</div>
                    `;
                }
            }
        }

        // Router View Mapper
        function navigate(tab) {
            State.activeTab = tab;
            document.querySelectorAll('.nav-item, .bnav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`[data-tab="${tab}"]`).forEach(el => el.classList.add('active'));
            
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            const activePage = document.getElementById(`page-${tab}`);
            if (activePage) activePage.classList.add('active');

            // Trigger corresponding API loads
            if (State.authToken) {
                if (tab === 'dashboard') loadDashboard();
                if (tab === 'accounts') loadAccounts();
                if (tab === 'automate') loadAutomateTasks();
                if (tab === 'users') loadUsers();
                if (tab === 'sessions') loadSessions();
                if (tab === 'websites') loadWebsites();
                if (tab === 'resellers') loadResellers();
                if (tab === 'usage') loadUsage();
                if (tab === 'analytics') loadAnalytics();
                if (tab === 'products') loadProducts();
                if (tab === 'violations') loadViolations();
                if (tab === 'proxies') loadProxies();
            }
        }

        // Fetch Wrapper with session handling
        async function apiFetch(endpoint, options = {}) {
            try {
                const res = await fetch(endpoint, options);
                if (res.status === 401) {
                    logout();
                    return null;
                }
                if (!res.ok) {
                    const errText = await res.text();
                    let errMsg = 'API request failed';
                    try {
                        const errData = JSON.parse(errText);
                        errMsg = errData.message || errData.error || errText || errMsg;
                    } catch (_) {
                        if (errText) errMsg = errText;
                    }
                    throw new Error(errMsg);
                }
                return await res.json();
            } catch (err) {
                alert('API Error: ' + err.message);
                return null;
            }
        }

        // Logout
        function logout() {
            fetch('/api/admin/auth/logout');
            State.authToken = '';
            State.user = null;
            localStorage.clear();
            renderApp();
        }

        // ── API DATA LOADERS ─────────────────────────────────────────────────────

        async function loadDashboard() {
            const data = await apiFetch('/api/admin/dashboard/stats');
            if (data) {
                State.stats = data;
                document.getElementById('stat-sessions').innerText = data.active_sessions;
                document.getElementById('stat-accounts').innerText = data.accounts_total;
                document.getElementById('stat-credits').innerText = data.credit_hits_today;
                
                // Populate active user sessions in dashboard overview
                const tbody = document.getElementById('dashboard-active-users-tbody');

        function filterAutomateTasks() {
            const list = document.getElementById('automate-tasks-list');
            if (!list) return;

            const search = (document.getElementById('auto-search')?.value || '').toLowerCase().trim();
            const toolFilter = document.getElementById('auto-tool-filter')?.value || '';
            const statusFilter = document.getElementById('auto-status-filter')?.value || '';

            let accounts = State.accounts || [];
            if (search) {
                accounts = accounts.filter(a => {
                    const triggerUrl = (a.automation_api_url || State.automationDefaults?.default_automation_api_url || '').toLowerCase();
                    const taskUID = (a.goauto_task_uid || '').toLowerCase();
                    const ingestKey = (a.automation_ingest_key || '').toLowerCase();
                    return a.name.toLowerCase().includes(search) ||
                        (a.website_name || '').toLowerCase().includes(search) ||
                        taskUID.includes(search) ||
                        ingestKey.includes(search) ||
                        triggerUrl.includes(search);
                });
            }
            if (toolFilter) {
                accounts = accounts.filter(a => String(a.website_id) === toolFilter);
            }
            if (statusFilter === 'configured') {
                accounts = accounts.filter(a => {
                    const taskUID = (a.goauto_task_uid || '').trim();
                    const ingestKey = (a.automation_ingest_key || '').trim();
                    return !!taskUID || !!ingestKey;
                });
            } else if (statusFilter === 'not_configured') {
                accounts = accounts.filter(a => {
                    const taskUID = (a.goauto_task_uid || '').trim();
                    const ingestKey = (a.automation_ingest_key || '').trim();
                    return !taskUID && !ingestKey;
                });
            }

            if ((State.accounts || []).length === 0) {
                list.innerHTML = `<div class="card" style="padding:24px;color:var(--text-muted);text-align:center;">Koi mapped account nahi mila. Pehle Mapped Accounts se account add karein.</div>`;
                return;
            }
            if (accounts.length === 0) {
                list.innerHTML = `<div class="card" style="padding:24px;color:var(--text-muted);text-align:center;">Koi account nahi mila. Search ya filter change karke try karein.</div>`;
                return;
            }

            const base = getPanelBaseUrl();
            list.innerHTML = accounts.map(a => {
                const triggerUrl = (a.automation_api_url || State.automationDefaults?.default_automation_api_url || '').trim();
                const taskUID = (a.goauto_task_uid || '').trim();
                const ingestKey = (a.automation_ingest_key || '').trim();
                const ingestToken = getIngestTokenForAccount(a);
                const isConfigured = !!(triggerUrl && taskUID) || !!ingestKey;
                return `
                <div class="card" style="margin-bottom:16px;padding:20px;">
                    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;">
                        <div>
                            <div style="font-weight:600;font-size:16px;">${a.name}</div>
                            <div style="color:var(--text-muted);font-size:13px;margin-top:4px;">${a.website_name || ''}</div>
                        </div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                            <span class="badge badge-${isConfigured ? 'success' : 'danger'}">${isConfigured ? 'Automation Set' : 'Not Configured'}</span>
                            <button class="btn-primary" style="padding:6px 12px;font-size:12px;" onclick="openEditAutomation(${a.id})">⚙️ Configure</button>
                        </div>
                    </div>
                    <div style="margin-top:14px;display:grid;gap:10px;">
                        <div>
                            <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">GoAuto Trigger API (per account / server)</div>
                            <code style="font-size:12px;word-break:break-all;">${triggerUrl ? `POST ${triggerUrl}` : '— not set —'}</code>
                        </div>
                        <div>
                            <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">GoAuto Task UID</div>
                            <code style="font-size:12px;word-break:break-all;">${taskUID || '— not set —'}</code>
                        </div>
                        <div>
                            <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">Cookie Ingest API URL</div>
                            <code style="font-size:12px;word-break:break-all;">${ingestKey ? `POST ${base}/api/automation/ingest/${ingestKey}` : '— not set —'}</code>
                        </div>
                        <div>
                            <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">GoAuto Ingest Token (TOOLSMANDI_INGEST_TOKEN)</div>
                            <code style="font-size:12px;word-break:break-all;">${ingestToken || '— not set —'}</code>
                        </div>
                    </div>
                </div>

        }

                        const optionsHtml = [

        function parseDevice(ua) {
            if (!ua) return 'Unknown';
            if (/mobile/i.test(ua)) return '📱 Mobile';
            if (/tablet|ipad/i.test(ua)) return '📟 Tablet';
            // Browser detection
            let browser = 'Browser';
            if (/Edg\//i.test(ua)) browser = 'Edge';
            else if (/OPR\//i.test(ua)) browser = 'Opera';
            else if (/Firefox\//i.test(ua)) browser = 'Firefox';
            else if (/Chrome\//i.test(ua)) browser = 'Chrome';
            else if (/Safari\//i.test(ua)) browser = 'Safari';
            // OS
            let os = '';
            if (/Windows/i.test(ua)) os = ' / Windows';
            else if (/Mac OS/i.test(ua)) os = ' / macOS';
            else if (/Linux/i.test(ua)) os = ' / Linux';
            else if (/Android/i.test(ua)) os = ' / Android';
            else if (/iOS|iPhone|iPad/i.test(ua)) os = ' / iOS';
            return '🖥️ ' + browser + os;
        }

        async function saveProxy(e) {
            e.preventDefault();
            const id = document.getElementById('proxy-id').value;
            const payload = {
                name: document.getElementById('proxy-name').value,
                proxy_type: document.getElementById('proxy-type').value,
                endpoint: document.getElementById('proxy-endpoint').value,
                status: document.getElementById('proxy-status').value
            };
            let res;
            if (id) {
                payload.id = parseInt(id);
                res = await apiFetch('/api/admin/proxies', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            } else {
                res = await apiFetch('/api/admin/proxies', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            }
            if (res) { closeModal('proxy'); loadProxies(); }
        }

        // Populates the proxy selector dropdown with saved proxies
        function populateProxySelector(currentProxyValue) {
            const sel = document.getElementById('acc-proxy-select');
            const manualWrap = document.getElementById('acc-proxy-manual-wrap');
            if (!sel) return;
            const proxies = State.proxies || [];
            sel.innerHTML = '<option value="">— No Proxy (Direct) —</option>' +
                proxies.filter(p => p.status === 'active').map(p =>
                    `<option value="${p.endpoint}">${p.name} (${p.proxy_type})</option>`
                ).join('') +
                '<option value="__manual__">✏️ Enter Manually...</option>';
            // Try to match saved proxy
            const matched = proxies.find(p => p.endpoint === currentProxyValue);
            if (currentProxyValue && matched) {
                sel.value = currentProxyValue;
                if (manualWrap) manualWrap.style.display = 'none';
            } else if (currentProxyValue && !matched) {
                sel.value = '__manual__';
                if (manualWrap) {
                    manualWrap.style.display = 'block';
                    const mi = document.getElementById('acc-proxy-manual');
                    if (mi) mi.value = currentProxyValue;
                }
            } else {
                sel.value = '';
                if (manualWrap) manualWrap.style.display = 'none';
            }
        }

                </div>

                <!-- 5. Product Mapping Dialog -->
                <div class="modal" id="modal-product">
                    <div class="modal-content">
                        <h2 class="card-title" id="prod-title" style="margin-bottom: 20px;">Add Allowed Product ID</h2>
                        <form id="form-product" onsubmit="saveProduct(event)">
                            <input type="hidden" id="prod-id">
                            <div class="form-group">
                                <label>Associated Website / Domain</label>
                                <select id="prod-website" class="form-control" required></select>
                            </div>
                            <div class="form-group">
                                <label>aMember Product ID(s) (Single integer, or comma-separated list)</label>
                                <input type="text" id="prod-product-id" class="form-control" placeholder="e.g. 5 or 1,2,3,22,29" required>
                            </div>
                            <div class="form-group">
                                <label>Product Name / Description</label>
                                <input type="text" id="prod-name" class="form-control" placeholder="e.g. Ahrefs Lite Weekly" required>
                            </div>
                            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                                <button type="button" class="btn-danger-outline" onclick="closeModal('product')">Cancel</button>
                                <button type="submit" class="btn-primary" id="prod-submit">Save Product</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 6. Detailed Quota Logs Modal -->
                <div class="modal" id="modal-usage-details">
                    <div class="modal-content" style="max-width: 850px; width: 90%;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
                            <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 0;" id="usage-details-title">User Detailed Usage Logs</h2>
                            <button type="button" onclick="closeModal('usage-details')" style="background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); line-height: 1;">&times;</button>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 16px;">
                            <input type="text" id="usage-details-search" class="form-control" placeholder="Search Endpoint..." style="width: 250px; margin-bottom: 0;">
                            <button type="button" class="btn-primary" id="usage-details-search-btn">Search</button>
                        </div>
                        <div class="table-responsive" style="max-height: 380px; overflow-y: auto;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Log Type</th>
                                        <th>Usage Hits / Rows</th>
                                        <th>Target Path</th>
                                        <th>Timestamp (IST)</th>
                                    </tr>
                                </thead>
                                <tbody id="usage-details-tbody">
                                    <tr>
                                        <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 12px;">No records found.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            // Setup Navigation trigger
            if (State.authToken) {
                loadAutomationDefaults().then(() => navigate(State.activeTab));
            } else {
                navigate(State.activeTab);
            }
        }

        // Render application at start
        renderApp();
    </script>
</body>
</html>
